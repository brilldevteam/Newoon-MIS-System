<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYC Export Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px Arial, sans-serif; color: #172033; background: #eef1f4; }
    header { padding: 20px 24px; background: white; border-bottom: 1px solid #cbd2d9; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0 0 12px; color: #5b6577; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    nav button { border: 1px solid #cbd2d9; background: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
    nav button[aria-pressed="true"] { background: #8d2428; border-color: #8d2428; color: white; }
    .links { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; }
    a { color: #8d2428; }
    main { padding: 24px 16px; max-width: 1500px; margin: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 6px; font-weight: bold; font-size: 13px; }
    img { display: block; width: 100%; height: auto; border: 1px solid #cbd2d9; background: white; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>KYC Export Review</h1>
    <p>Synthetic data only. Left: DOCX as rendered by Microsoft Word. Right: PDF rendered by the production Chromium pipeline.</p>
    <nav id="fixtures"></nav>
    <div class="links" id="links"></div>
  </header>
  <main id="pages"></main>
  <script>
    const fixtures = { standard: 'Standard case', complex: 'Complex case (multi-layer, long/Arabic names, missing values)' };
    const nav = document.getElementById('fixtures');
    const pages = document.getElementById('pages');
    const links = document.getElementById('links');

    function exists(src) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);
        image.src = src;
      });
    }

    function figure(label, src) {
      const element = document.createElement('figure');
      const caption = document.createElement('figcaption');
      caption.textContent = label;
      element.append(caption);
      if (src) {
        const image = document.createElement('img');
        image.src = src;
        image.alt = label;
        image.loading = 'lazy';
        element.append(image);
      }
      return element;
    }

    async function show(name) {
      [...nav.children].forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.name === name)));
      links.innerHTML = `<a href="${name}/kyc-sample.docx">DOCX</a><a href="${name}/kyc-sample-word.pdf">Word-exported PDF</a><a href="${name}/kyc-chromium.pdf">Production PDF</a>`;
      pages.replaceChildren();
      for (let number = 1; number <= 20; number++) {
        const word = `${name}/word-page-${number}.png`;
        const pdf = `${name}/pdf-page-${number}.png`;
        const [hasWord, hasPdf] = await Promise.all([exists(word), exists(pdf)]);
        if (!hasWord && !hasPdf) break;
        const row = document.createElement('div');
        row.className = 'row';
        row.append(figure(`Word page ${number}`, hasWord ? word : ''), figure(`PDF page ${number}`, hasPdf ? pdf : ''));
        pages.append(row);
      }
    }

    for (const [name, label] of Object.entries(fixtures)) {
      const button = document.createElement('button');
      button.dataset.name = name;
      button.textContent = label;
      button.addEventListener('click', () => show(name));
      nav.append(button);
    }
    show('standard');
  </script>
</body>
</html>
